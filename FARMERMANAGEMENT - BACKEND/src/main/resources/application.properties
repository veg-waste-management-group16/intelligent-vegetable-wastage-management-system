# ==================================================
# SERVER CONFIGURATION
# ==================================================
server.port=8080

# ==================================================
# MYSQL DATABASE CONFIGURATION
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:3306/farmer_stock_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / HIBERNATE CONFIGURATION
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==================================================
# THYMELEAF CONFIGURATION
# ==================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ==================================================
# SERVER CONFIGURATION
# ==================================================
# server.port=8081
server.servlet.context-path=/

# ==================================================
# APPLICATION CONFIGURATION
# ==================================================
spring.application.name=Farmer-Stock-Management
spring.profiles.active=dev

# ==================================================
# LOGGING CONFIGURATION
# ==================================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# AI FastAPI integration
ai.fastapi.predict-url=http://localhost:8000/predict


